<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Halo Switch</title>
    <meta
      name="description"
      content="New tenant or current tenant."
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html">
          <span class="brand-name">Halo Switch</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Primary">
          <a href="index.html">Home</a>
          <span class="nav-sep" aria-hidden="true">/</span>
          <a class="nav-product" href="services.html">HALOSWITCH</a>
          <span class="nav-sep" aria-hidden="true">/</span>
          <a href="pricing.html">How it works</a>
          <span class="nav-sep" aria-hidden="true">/</span>
          <a href="about.html">About</a>
          <span class="nav-sep" aria-hidden="true">/</span>
          <a href="contact.html" aria-current="page">Contact</a>
        </nav>
      </div>
    </header>

    <main id="main">
      <header class="page-hero">
        <h1>Contact</h1>
        <p class="lede">New tenant or current tenant.</p>
      </header>

      <section class="section contact-block">
        <form
          class="contact-form"
          action="https://formspree.io/f/mbgjrgeq"
          method="POST"
        >
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="organization">Organization</label>
            <input
              id="organization"
              name="organization"
              type="text"
              autocomplete="organization"
              required
            />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="phone">Phone <span class="optional">optional</span></label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" />
            </div>
          </div>

          <div class="field">
            <label for="licenses">Licenses you already own</label>
            <input id="licenses" name="licenses" type="text" />
          </div>

          <div class="field">
            <label for="message">Note</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <input type="hidden" name="_subject" value="Halo Switch enquiry" />
          <input
            type="text"
            name="_gotcha"
            tabindex="-1"
            autocomplete="off"
            aria-hidden="true"
            class="hp"
          />

          <button class="button button-outline" type="submit">Send</button>

          <p class="form-note">
            Please do not include passwords, tenant credentials, or confidential information in
            this form.
          </p>
        </form>
      </section>

    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© Halo Switch / Jeff DeJaegher</span>
        <span>
          <a class="footer-product" href="services.html">HALOSWITCH</a>
          ·
          <a href="about.html">About</a>
          ·
          <a href="contact.html">Contact</a>
        </span>
      </div>
    </footer>
    <script src="assets/site.js"></script>
  </body>
</html>
